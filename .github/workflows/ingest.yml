name: Ingest prices

on:
  schedule:
    # Toutes les 30 min, 13:00-21:30 UTC, lun-ven — couvre la séance
    # NYSE (9:30-16:00 ET) en heure d'été (EDT) et d'hiver (EST). Le
    # script vérifie la session réelle du jour via exchange-calendars
    # et sort proprement en dehors de la séance.
    - cron: "0,30 13-21 * * 1-5"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r ingest/requirements.txt

      - name: Run ingestion
        working-directory: ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python ingest.py
