name: Ingest daily closes

on:
  schedule:
    # Une fois par jour, 21:30 UTC — toujours après la clôture NYSE
    # (16:00 ET), que ce soit en EDT (20:00 UTC) ou en EST (21:00 UTC).
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      period:
        description: 'Fenêtre yfinance à récupérer ("5d" en routine, "1y" pour le backfill initial)'
        required: false
        default: "5d"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r ingest/requirements.txt

      - name: Run ingestion
        working-directory: ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python ingest.py --period "${{ github.event.inputs.period || '5d' }}"

      # Short-list uniquement (~20 titres, pas les 500) : yfinance n'a pas
      # d'appel groupé pour les options. Non-bloquant — si Yahoo boude les
      # requêtes d'options ce jour-là, ça ne doit pas faire échouer
      # l'ingestion des prix, qui est le cœur du pipeline.
      - name: Fetch option theta (short-list)
        working-directory: ingest
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python fetch_theta.py
