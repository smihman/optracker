<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>S&amp;P 500 — Administration</title>
    <link rel="icon" href="./logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="./logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Palette noir/blanc/gris iOS (dark mode) : couleur réservée
      // uniquement aux chiffres de performance (pos/neg), tout le
      // reste (fonds, bordures, boutons) reste monochrome.
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              app: {
                bg: "#000000",
                surface: "#1c1c1e",
                border: "#2c2c2e",
                muted: "#8e8e93",
                text: "#ffffff",
              },
              pos: "#30d158",
              neg: "#ff453a",
            },
            keyframes: {
              fadeIn: {
                "0%": { opacity: "0" },
                "100%": { opacity: "1" },
              },
              fadeInUp: {
                "0%": { opacity: "0", transform: "translateY(6px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
              scaleIn: {
                "0%": { opacity: "0", transform: "scale(0.96)" },
                "100%": { opacity: "1", transform: "scale(1)" },
              },
            },
            animation: {
              "fade-in": "fadeIn 0.25s ease-out both",
              "fade-in-up": "fadeInUp 0.35s ease-out both",
              "scale-in": "scaleIn 0.2s cubic-bezier(0.34,1.56,0.64,1) both",
            },
            transitionTimingFunction: {
              juicy: "cubic-bezier(0.34, 1.56, 0.64, 1)",
            },
          },
        },
      };
    </script>
    <style>
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #2c2c2e;
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3a3a3c;
      }
      * {
        scrollbar-color: #2c2c2e transparent;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body class="bg-app-bg text-app-text min-h-screen">
    <div id="app"></div>
    <script type="module" src="./admin.js"></script>
  </body>
</html>
